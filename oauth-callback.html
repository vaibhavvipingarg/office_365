<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Salesforce OAuth Callback</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; margin: 2em; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h2>Processing Salesforce Authentication...</h2>
    <div id="status">Please wait...</div>

    <script>
        (function() {
            function getQueryParams() {
                const params = {};
                const hash = window.location.hash.substring(1);
                const search = window.location.search.substring(1);
                const queryString = hash || search;

                queryString.split('&').forEach(pair => {
                    if (pair === '') return;
                    const [key, value] = pair.split('=');
                    params[decodeURIComponent(key)] = decodeURIComponent(value || '');
                });

                return params;
            }

            function displayStatus(message, type) {
                const statusEl = document.getElementById('status');
                statusEl.textContent = message;
                statusEl.className = type;
            }

            function handleCallback() {
                const params = getQueryParams();
                console.log('Received params:', params);

                if (params.access_token) {
                    displayStatus('Authentication successful! Processing...', 'success');
                    
                    if (window.opener) {
                        try {
                            window.opener.postMessage({
                                type: 'salesforce_oauth_response',
                                access_token: params.access_token,
                                instance_url: params.instance_url,
                                id: params.id,
                                expires_in: params.expires_in
                            }, '*');
                            
                            setTimeout(() => window.close(), 2000);
                        } catch (error) {
                            displayStatus('Error sending response to main window: ' + error.message, 'error');
                        }
                    } else {
                        displayStatus('Authentication successful, but unable to communicate with the main application.', 'info');
                    }
                } else if (params.error) {
                    displayStatus('Authentication error: ' + params.error + 
                        (params.error_description ? ' - ' + params.error_description : ''), 'error');
                } else {
                    displayStatus('No authentication data received. This page should be accessed via Salesforce OAuth flow.', 'info');
                }
            }

            // Run when the page loads
            handleCallback();
        })();
    </script>
</body>
</html>
