<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
        // This file is a compatibility fix for any hardcoded paths
        // It redirects from /oauth-callback.html to the correct path /oauth/callback/
        window.onload = function() {
            // Preserve the hash and query parameters when redirecting
            const redirectUrl = '/office_365/oauth/callback/' + window.location.search + window.location.hash;
            console.log('Redirecting from compatibility path to:', redirectUrl);
            window.location.href = redirectUrl;
        };
    </script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: center;
            margin: 50px auto;
            max-width: 600px;
            line-height: 1.5;
        }
        .message {
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="message">
        <h1>Redirecting...</h1>
        <p>This page is redirecting you to the correct OAuth callback URL.</p>
        <p>If you're not redirected automatically, <a href="/office_365/oauth/callback/">click here</a>.</p>
    </div>
</body>
</html>
